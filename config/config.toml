[settings]
dotfiles.root = "~/.mise-dotfiles"

[bootstrap.mise_shell_activate]
bashrc = "activate"

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.bash_profile" = { mode = "track" }
"~/.bashrc" = { mode = "track" }
"~/.config/mise" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }

[tools]
aws-vault = "7"
go = "1.27"
jq = "1.8.2"
neovim = "0.12.5"
node = "24"
ripgrep = "15"
terraform = "1.16"
tree-sitter = "latest"
yq = "4"
